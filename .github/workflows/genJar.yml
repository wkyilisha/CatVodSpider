name: Spider Jar Gen CI (Simplified)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Project
        run: ./gradlew build

      # --- 查找生成的JAR文件 ---
      - name: Find and Copy Jar files
        run: |
          # 查找所有生成的jar文件
          find . -name "*.jar" -type f | grep -v "gradle" | head -10
          
          # 创建jar目录
          mkdir -p ./jar ./json
          
          # 尝试从常见位置复制jar
          if [ -f "./app/build/libs/*.jar" ]; then
            cp ./app/build/libs/*.jar ./jar/custom_spider.jar 2>/dev/null || true
          fi
          
          if [ -f "./build/libs/*.jar" ]; then
            cp ./build/libs/*.jar ./jar/custom_spider.jar 2>/dev/null || true
          fi
          
          # 生成MD5
          if [ -f "./jar/custom_spider.jar" ]; then
            md5sum ./jar/custom_spider.jar > ./jar/custom_spider.jar.md5
            echo "JAR found and MD5 generated"
          else
            echo "Warning: No jar file found"
          fi

      # --- 提交到当前仓库 ---
      - name: Add & Commit to Current Repository
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"

      # --- 上传构件 ---
      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Spider-Jar
          path: ./jar/custom_spider.jar
          retention-days: 7
